services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - kck_data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  kck_data:
  caddy_data:
  caddy_config:
